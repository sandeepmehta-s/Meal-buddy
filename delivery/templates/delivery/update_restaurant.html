{% extends 'delivery/base.html' %}
{% block title %}Edit {{ restaurant.name }} | Meal Mate{% endblock %}
{% block nav %}<nav><a href="{% url 'open_show_restaurant' %}">Restaurants</a><a href="{% url 'logout' %}">Log out</a></nav>{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">Restaurant catalog</p><h1>Edit listing.</h1><form class="form-grid" action="{% url 'update_restaurant' restaurant.id %}" method="post">{% csrf_token %}<label class="field">Name<input name="name" value="{{ restaurant.name }}" maxlength="80" required></label><label class="field">Cuisine<input name="cuisine" value="{{ restaurant.cuisine }}" required></label><label class="field">Rating<input type="number" name="rating" value="{{ restaurant.rating }}" min="0" max="5" step="0.1" required></label><label class="field">Image URL<input type="url" name="picture" value="{{ restaurant.picture }}"></label><button class="button-primary" type="submit">Save changes</button></form></section>{% endblock %}
