{% extends 'delivery/base.html' %}
{% block title %}Add restaurant | Meal Mate{% endblock %}
{% block nav %}<nav><a href="{% url 'admin_home' %}">Dashboard</a><a href="{% url 'logout' %}">Log out</a></nav>{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">Restaurant catalog</p><h1>Add a restaurant.</h1><form class="form-grid" action="{% url 'add_restaurant' %}" method="post">{% csrf_token %}<label class="field">Name<input name="name" maxlength="80" required></label><label class="field">Cuisine<input name="cuisine" maxlength="200" placeholder="North Indian, Italian..." required></label><label class="field">Rating<input type="number" name="rating" min="0" max="5" step="0.1" required></label><label class="field">Image URL<input type="url" name="picture" placeholder="Optional"></label><button class="button-primary" type="submit">Add restaurant</button></form></section>{% endblock %}
