{% extends 'delivery/base.html' %}
{% block title %}Sign in | Meal Mate{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">Welcome back</p><h1>Pick up where you left off.</h1><p>Sign in to browse menus and manage your order.</p><form class="form-grid" action="{% url 'signin' %}" method="post">{% csrf_token %}<label class="field">Username<input type="text" name="username" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button-primary" type="submit">Sign in</button></form><p>New here? <a href="{% url 'open_signup' %}">Create an account</a></p></section>{% endblock %}
