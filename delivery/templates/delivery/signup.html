{% extends 'delivery/base.html' %}
{% block title %}Create account | Meal Mate{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">Join Meal Mate</p><h1>Make your next order feel easy.</h1><p>Create your account once, then keep every meal in reach.</p><form class="form-grid" action="{% url 'signup' %}" method="post">{% csrf_token %}<label class="field">Username<input type="text" name="username" maxlength="20" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label class="field">Email<input type="email" name="email" autocomplete="email" required></label><label class="field">Mobile<input type="tel" name="mobile" pattern="[0-9]{10}" inputmode="numeric" placeholder="10-digit number" required></label><label class="field">Delivery address<textarea name="address" rows="3" required></textarea></label><button class="button-primary" type="submit">Create account</button></form><p>Already registered? <a href="{% url 'open_signin' %}">Sign in</a></p></section>{% endblock %}
